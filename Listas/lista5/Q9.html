<!DOCTYPE html>

<head>

    <title>Filtro de Produtos</title>

<body>
    <h2>Filtrar Produtos por Categoria</h2>
    <form action="produtos.php" method="get">
        <label for="categoria">Escolha uma categoria:</label>
        <select name="categoria" id="categoria">
